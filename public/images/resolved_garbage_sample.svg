  <text x="35" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#2ecc71">✅ MUNICIPAL RESOLUTION PROOF</text>
  <text x="35" y="62" font-family="monospace" font-size="11" fill="#FFFFFF">SOLID WASTE SANITATION WARD</text>
  <!-- Work Completion Badge -->
  <rect x="420" y="20" width="160" height="34" rx="17" fill="#2ecc71"/>
  <text x="500" y="42" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#07192E" text-anchor="middle">SITE SANITIZED</text>
</svg>