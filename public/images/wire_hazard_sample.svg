<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e272e"/>
      <stop offset="100%" stop-color="#2f3542"/>
    </linearGradient>
    <linearGradient id="wireGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1c40f"/>
      <stop offset="50%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#ffa502"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#skyGrad)"/>
  <!-- Street & Pavement -->
  <rect y="280" width="600" height="120" fill="#1e2022"/>
  <line x1="0" y1="280" x2="600" y2="280" stroke="#747d8c" stroke-width="4"/>
  <!-- Utility Pole -->
  <rect x="120" y="50" width="28" height="300" fill="#57606f" rx="3"/>
  <line x1="80" y1="90" x2="190" y2="90" stroke="#747d8c" stroke-width="8"/>
  <rect x="90" y="80" width="16" height="20" fill="#ced6e0" rx="3"/>
  <rect x="160" y="80" width="16" height="20" fill="#ced6e0" rx="3"/>
  <!-- Snapped Live Wire Hanging and Touching Pavement -->
  <path d="M 168 100 Q 240 220 280 230 T 360 310" stroke="url(#wireGlow)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Sparking Effect at Ground Contact -->
  <circle cx="360" cy="310" r="28" fill="#ffdd59" opacity="0.4"/>
  <polygon points="360,285 366,305 385,310 368,318 365,335 354,320 335,312 352,302" fill="#ffffff"/>
  <polygon points="360,290 365,306 378,310 366,316 364,328 356,317 342,311 355,304" fill="#ff9f43"/>
  <line x1="360" y1="310" x2="395" y2="280" stroke="#fffa65" stroke-width="3"/>
  <line x1="360" y1="310" x2="330" y2="270" stroke="#fffa65" stroke-width="3"/>
  <line x1="360" y1="310" x2="385" y2="340" stroke="#fffa65" stroke-width="2"/>
  <!-- High Voltage Badge -->
  <rect x="20" y="20" width="220" height="48" rx="6" fill="#000000" fill-opacity="0.8"/>
  <text x="35" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#ff4d4f">CIVIC EVIDENCE PHOTO</text>
  <text x="35" y="58" font-family="monospace" font-size="11" fill="#ffffff">GEO: 12.9250° N, 77.5938° E</text>
  <!-- Warning badge -->
  <rect x="400" y="20" width="180" height="32" rx="16" fill="#ff4757"/>
  <text x="490" y="41" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">LIVE WIRE HAZARD</text>
</svg>