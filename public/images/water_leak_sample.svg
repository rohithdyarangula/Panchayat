<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wetRoad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192a56"/>
      <stop offset="100%" stop-color="#0c2461"/>
    </linearGradient>
    <radialGradient id="waterPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2d3" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0abde3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10ac84" stop-opacity="0.2"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#wetRoad)"/>
  <!-- Broken Water Main Gushing -->
  <ellipse cx="300" cy="270" rx="220" ry="90" fill="url(#waterPool)"/>
  <ellipse cx="300" cy="270" rx="140" ry="50" fill="#48dbfb" opacity="0.6"/>
  <!-- Burst Pipe Crack in ground -->
  <ellipse cx="300" cy="250" rx="35" ry="16" fill="#1e272e"/>
  <!-- Water Fountain Geyser -->
  <path d="M 285 250 Q 270 120 290 80 Q 300 130 305 250 Z" fill="#00d2d3" opacity="0.8"/>
  <path d="M 295 250 Q 320 100 310 70 Q 300 140 315 250 Z" fill="#48dbfb" opacity="0.9"/>
  <circle cx="290" cy="75" r="10" fill="#c7ecee"/>
  <circle cx="315" cy="65" r="8" fill="#ffffff"/>
  <!-- Ripples -->
  <ellipse cx="300" cy="270" rx="70" ry="25" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <ellipse cx="300" cy="270" rx="180" ry="60" fill="none" stroke="#c7ecee" stroke-width="1.5" opacity="0.5"/>
  <!-- Evidence stamp -->
  <rect x="20" y="20" width="220" height="48" rx="6" fill="#000000" fill-opacity="0.8"/>
  <text x="35" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#ff4d4f">CIVIC EVIDENCE PHOTO</text>
  <text x="35" y="58" font-family="monospace" font-size="11" fill="#ffffff">GEO: 12.8984° N, 77.5997° E</text>
  <!-- Warning badge -->
  <rect x="390" y="20" width="190" height="32" rx="16" fill="#0abde3"/>
  <text x="485" y="41" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">WATER MAIN BURST</text>
</svg>